name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: classroom_companion
          POSTGRES_USER: classroom_app
          POSTGRES_PASSWORD: classroom_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classroom_app -d classroom_companion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+asyncpg://classroom_app:classroom_ci_password@localhost:5432/classroom_companion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      
      - name: Apply committed database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Check model and database schema are in sync
        working-directory: backend
        run: alembic check

      - name: Run backend tests
        run: python -m pytest backend/tests -q
