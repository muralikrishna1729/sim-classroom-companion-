services:
  db:
    image: postgres:16-alpine
    container_name: sim-classroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: classroom_companion
      POSTGRES_USER: classroom_app
      POSTGRES_PASSWORD: classroom_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom_app -d classroom_companion"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sim-classroom-api
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://classroom_app:classroom_local_dev@db:5432/classroom_companion
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
